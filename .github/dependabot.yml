version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      # pyo3 and rust-numpy are lockstep (numpy 0.N requires pyo3 ^0.N), so
      # a lone bump of either cannot compile. Listed first so they land in
      # this group rather than rust-minor-patch.
      pyo3-stack:
        patterns:
          - "pyo3"
          - "numpy"
        update-types:
          - "major"
          - "minor"
          - "patch"
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # CI-only Node toolchain for the docs search-excerpt smoke test
  # (.github/scripts/search_excerpt_smoke.mjs). Weekly version updates keep
  # the transitive pins (undici, source-map-js, ...) from drifting into
  # advisories; security-fix PRs for open alerts are governed separately by
  # the repo's "Dependabot security updates" setting.
  - package-ecosystem: "npm"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
