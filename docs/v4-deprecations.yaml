    notes: "Unit-FE event study default; spec='within'|'pooled' opt-in (pooled = old MPD model, repeated cross-sections). Wild bootstrap in event-study mode = explicit error. SHIPPED 3.9 (Phase 3(a)): TWFE.fit(event_study=True, spec=, reference_period=, post_periods=) returns the unified EventStudyResults surface natively (source='TwoWayFixedEffects', estimation_spec + post_periods provenance); the shared core is DifferenceInDifferences._fit_event_study_core (the relocated MPD fit body, parameterized - MPD numerics/messages/warning-attribution bit-identical); ES calls pass time=/unit= as KEYWORDS (slot 4 stays post= through the M-082 window; section 4.1's snippet amended to keyword form). post_periods= is REQUIRED (non-empty) in ES mode (Phase 3(a) review R4, section 4.1 second amendment): the boundary is unobservable from time-invariant D_i, so MPD's midpoint default is a silent guess and is not carried over - MPD itself keeps it through 3.9. Day-one unit auto-cluster (user decision 2026-08-07) with static TWFE's carve-outs mirrored lane-for-lane: dropped on Conley (no implicit spatial x unit product kernel), never injected as a survey PSU (implicit-per-observation-PSU rule), dropped for explicit one-way analytical families; explicit cluster= passes through and matches MPD's explicit-cluster behavior (PSU injection included; a survey design carrying its own PSU keeps PSU precedence on every class). The wild ValueError and the no-legacy-reference-warning contract are live from the mode's 3.9 birth (the section 4.1 'at 4.0' clause describes when MPD's fallback dies with the class). MultiPeriodDiD.__init__ is the warning shim (forwarding *args/**kwargs + an import-time __signature__ mirror of DiD's constructor; set_params re-emits via its probe re-init; the static-type-checking loss for the deprecated class is the DEFERRED.md decision-record waiver). Consumer ports: HonestDiD + PreTrendsPower calendar container routes reconstruct the native-branch inputs from the post_periods provenance (HonestDiD geometry-scoped to chronological partitions - REGISTRY Note + DEFERRED row for the pre-existing native non-suffix geometry; PreTrendsPower plumbs reference_period through the gamma-unit helper incl. the string-label degradation); plot_event_study derives calendar splits from the provenance and shades per contiguous pre-run on both renderers; DiagnosticReport/BusinessReport explicitly reject the surface (TODO row for admission). 4.0 REMOVAL NOTE: the TWFE ES branch builds the surface via the internal MultiPeriodDiDResults container + _from_mpd - decouple when [M-011] removes the container."
