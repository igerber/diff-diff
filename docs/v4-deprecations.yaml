    notes: "Shimmed in 3.9: fit(aggregate=) warns via the shared NOT_SUPPLIED sentinel (a plain fit() never warns; supplying ANY value, None included, warns once, then the legacy routing runs unchanged - the PRE-EXISTING value validation survives, so None/unknown strings still raise ValueError after the warning, and a supplied mode that mismatches the panel shape still raises the shape error). UNLIKE every prior adopter, the param is a MODE SELECTOR, not an aggregation choice: 'overall' (exactly two periods -> HeterogeneousAdoptionDiDResults, scalar WAS) vs 'event_study' (more than two -> the per-horizon HeterogeneousAdoptionDiDEventStudyResults) - mutually exclusive panel shapes, so the SENTINEL resolves by panel-shape INFERENCE (_infer_aggregate_mode: distinct time values <= 2 -> overall, else event_study), running AFTER the time/time_col alias reconciliation (rows M-035..M-039 keep both spellings live). BEHAVIOR DELTA: a plain multi-period fit() previously raised the two-period shape error and now runs the event-study mode (error -> works; no numbers change on any previously-working call). One shape error stays sentinel-reachable: the staggered last-cohort auto-filter can drop a T>2 panel below three periods post-inference (its message no longer teaches the kwarg). POST-FIT SUCCESSOR: both results classes take the M-122 mixin as PURE VIEWS with per-class supported subsets - the overall class supports only 'simple' (one-row bit-exact relay: target = target_parameter, the estimand label 'WAS'/'WAS_d_lower' per the dCDH precedent; n = n_obs, the contributing-unit count, n_kind='units' - the treated/control split is disjoint on continuous designs but the mass-point masks can overlap in a ~1-ULP tolerance band, so n_obs is the single source; df = resolve_inference_df, provenance-exact: finite survey df on TSL fits, NaN otherwise - replicate designs are rejected at fit so the 0-sentinel branch is unreachable), and the event-study class supports only 'event_study' (build_event_study_surface passthrough via the _from_had adapter, cband fields included). Cross-mode levels fail closed via the mixin vocabulary message - the two modes share no computable estimand (ES fits store no overall WAS; joint cross-horizon covariance is the DEFERRED.md row). NO KIT is retained (views work on pickles from any release) and NO bootstrap gate exists (HAD's n_bootstrap feeds only the sup-t cband critical value; pointwise inference is always analytical). The _from_had adapter's n_kind was corrected 'obs' -> 'units' with this row (n_obs_per_horizon counts units), and AggregationResult.summary() gained the single-non-'att'-target rendering (the estimand-heading widening; see the v4-design section 6 rule). Consumer admission is DEFERRED, not by-design (M-093 amendment): HAD ES coefficients ARE reference-normalized (each horizon differences against the F-1 anchor) but the anchor row is omitted (identically zero AND the WAS is not identified there) and no joint covariance exists. The workflow twin did_had_pretest_workflow(aggregate=) is row M-139 (same inference, same release)."

