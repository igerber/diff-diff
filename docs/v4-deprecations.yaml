# status vocabularies, locator grammar, lifecycle rules). Enforced by
# tests/test_v4_matrix.py, which asserts every row's `status` against reality
# at HEAD on every CI run - a PR that changes any surface named here MUST flip
# the corresponding row in the same diff or CI fails.
#
# FORWARD-REFERENCE NOTE (for reviewers): `new` locators on `planned` rows name
# 3.9/4.0 surface that intentionally does NOT exist at HEAD; the enforcement
# test asserts their ABSENCE until the owning phase ships.
#
# FORMAT CONTRACT (parsed by a purpose-built scanner, no PyYAML): top-level
# `rows:` list; each row a flat mapping of single-line scalars; `code_refs` as
# an inline flow list; no anchors, no multi-line strings. Line-leading comments
# only (a trailing `#` after a value is parsed as part of the value).
#
# Locator grammar: "diff_diff:Name" (top-level export), "diff_diff:Class[param]"
# (__init__ param), "diff_diff:Class.method[param]" (method param),
# "diff_diff:Class.attr" (field/property). Module part must always import.

