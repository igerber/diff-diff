    status: done
    phase: 2
    code_refs: [diff_diff/estimators.py, diff_diff/twfe.py]
    test_ref: tests/test_v4_inference_policy.py
    notes: "Spec section 7 selector contract + roster guard. inference='wild_bootstrap' selects wild CLUSTER bootstrap offered as an ALTERNATIVE to analytical SEs; the SUPPORTING roster is DifferenceInDifferences + TwoWayFixedEffects. NOT a uniformity mandate over every bootstrap - each estimator whose bootstrap IS its inference method runs a materially different procedure and keeps n_bootstrap as documented domain vocabulary (section 6 precedent): CallawaySantAnna = influence-function multiplier bootstrap; SunAbraham = unit-pairs bootstrap (Rao-Wu rescaled under stratified/PSU survey designs); ChaisemartinDHaultfoeuille = group-level influence-function multiplier bootstrap, upgrading to PSU-level Hall-Mammen wild clustering under survey designs with strictly-coarser PSUs. Spelling any of those 'wild_bootstrap' would make a uniform name carry altered meaning (section 8 rule 8). MultiPeriodDiD EXPOSES the param but has no wild-bootstrap path (warns, falls back to analytical); it is removed at 4.0 [M-010] and section 4.1 replaces the fallback with a raise - so the roster pins SUPPORT, not param presence. SCOPE (pre-3.9 state, closed by this row): the selector did not fail closed - inference= was stored unvalidated, and DiD silently routed wild_bootstrap WITHOUT cluster= to analytical (formerly pinned by tests/test_wild_bootstrap.py::test_did_wild_bootstrap_requires_cluster, flipped BY DESIGN in the shipping PR with a CHANGELOG disclosure), so a typo or a missing prerequisite silently changed the SE/p/CI procedure - a no-silent-failures violation. SHIPPED in 2(d) PR-B, fail closed = REFUSE, not warn-and-degrade: (a) the accepted value set is exactly {'analytical', 'wild_bootstrap'}, string-typed (an isinstance guard rejects non-string values that pass bare tuple membership, e.g. a one-element ndarray), validated on __init__ AND transactional set_params; (b) wild_bootstrap WITHOUT cluster= raises ValueError at fit - REGISTRY defines WCR as 'inference=\"wild_bootstrap\" (with cluster=)', so the combination is incoherent rather than merely unsupported; (c) AMENDED FLOOR (user-approved 2026-08-07, deviation recorded in v4-design section 7 in the same diff): wild with n_bootstrap < 2 raises at fit - not the originally-locked < 1 - because n_bootstrap in {0, 1} deterministically degenerates (the wild routing never consulted n_bootstrap > 0; both values ran WCR with too few draws and returned a wild-labeled all-NaN inference tuple with no warning). The survey and Conley front doors keep precedence (their NotImplementedError rejections fire first); TWFE's unit auto-cluster satisfies the cluster prerequisite; MPD's warn-and-fallback is n_bootstrap-independent and unchanged. Also fixed in the same PR: _bootstrap_results is now reset per-fit, closing stale inference_method/bootstrap metadata on refits after set_params(inference='analytical'). test_ref covers: the exact accepted value set, an invalid spelling and a non-string value, transactional set_params, DiD with and without cluster, the {0,1} floor with message pins, boundary n=2 acceptance with a finite quintet, front-door precedence at sub-floor counts on DiD and TWFE, MPD's fallback at n=0/1/999, refit transitions, and the roster itself (a future estimator gaining WCR must adopt the selector or land its own row). Companion to [M-081] (n_bootstrap semantics). introduced_in gates the 3.9 cut for the same reason as [M-081]; behavior-at-done requires test_ref."
