    notes: "Semantic unification only: n_bootstrap=0 = bootstrap off wherever an analytical path exists; per-estimator counts stay tuned (999 light / 200 compute-heavy). No numeric default changes. introduced_in gates the 3.9 cut (pattern of [M-091]/[M-092]): the unification is a Phase 2 obligation and must not slip past the bump unflipped. deprecated_in stays null deliberately - a flip version would arm the early-flip guard against the Phase 2 PR, which lands while __version__ is still 3.8.x. SHIPPED in 2(d) PR-B: a shared utils.validate_n_bootstrap (promoted verbatim from ChangesInChanges' local validator; non-negative int, accepts numpy integers, rejects bool/None/float/negative) is applied at __init__ across the previously-unvalidated roster - DifferenceInDifferences (MultiPeriodDiD/TwoWayFixedEffects inherit), CallawaySantAnna, SunAbraham, EfficientDiD, ImputationDiD, TwoStageDiD, WooldridgeDiD, ContinuousDiD, StaggeredTripleDifference - with CiC/QDiD re-pointed to the shared helper (byte-identical message). SCOPE of 0=off: 0 stays legal at construction and still means bootstrap off on every > 0-gated analytical lane (the eight zero-default sweep classes); under DiD/TWFE inference='wild_bootstrap', where 0 NEVER meant off (the routing consults only the selector - it ran WCR with zero draws and returned a wild-labeled all-NaN inference tuple), 0 and 1 now raise at fit per [M-096]. EXCEPTION: HeterogeneousAdoptionDiD has an analytical pointwise path but deliberately floors n_bootstrap >= 1 (its n_bootstrap powers ONLY the optional sup-t band, whose off-switch is fit(cband=False); n_bootstrap=0 would be a second, ambiguous off-switch) - the 0=off clause does not apply to HAD and no HAD behavior changed. Already-validated estimators (SyntheticDiD >= 2 unless jackknife, TROP >= 2, HAD >= 1, dCDH non-negative) keep their own checks; their type-blind holes are a TODO.md row, not this PR."
  - id: M-096
    kind: behavior
    group: policy-wild-bootstrap
    old: "diff_diff:DifferenceInDifferences[inference]"
    new: null
    introduced_in: "3.9"
    deprecated_in: null
