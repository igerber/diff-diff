    notes: "Shimmed in 3.9: fit(aggregate=) warns via the shared NOT_SUPPLIED sentinel (a plain fit() never warns; supplying ANY value, None included, warns - CS-style warn-and-still-work, since the param genuinely worked, unlike dCDH's raise; group/all + unknown values keep their ValueErrors AFTER the warning). The event-study surface is now ALWAYS computed at fit - the pooled regression always included the interactions, and the extraction + per-event Bell-McCaffrey contrast DOFs (hc2_bm) are no longer gated on fit-time aggregate, so the param is behaviorally inert; consequences: plain-fit summary() prints the ES table, to_dataframe('event_study') is total on 3.9+ fits, DiagnosticReport's heterogeneity and (kappa_pre>=2) parallel_trends checks now run on plain fits, and the hc2_bm overall contrast shares the m>1 batch-relative noise floor (fail-closed + warned; REGISTRY Note). Both aggregate() levels are pure VIEWS: 'event_study' -> build_event_study_surface(self); 'simple' relays overall_att/se/t/p/CI bit-exact with target='att' (the scalar is the post-average, NOT the per-event trimmed aggregate ATT), n=n_treated_units/'units' (treated-only scope: control units overlap treated across sub-experiments, so no disjoint total exists), df=inference_df. SUPPORTED SUBSET simple|event_study - group/calendar fail closed via the mixin message; balance_e applies to no level (empty vocabulary); weights= rejected. Every inference mode relays (survey TSL, replicate refit, hc2_bm fail-close). honest/pretrends container admission widened to Stacked-sourced containers (see M-093): base_period='universal' ClassVar + singleton reference_event_times property thread the provenance; analytical fits carry df_survey=None (the resolver reads df_inference, a name Stacked does not use - deliberate: normal-theory FLCI, see the REGISTRY Note and the TODO adapter-naming row's cross-reference)."
