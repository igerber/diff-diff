  - id: M-096
    kind: behavior
    group: policy-wild-bootstrap
    old: "diff_diff:DifferenceInDifferences[inference]"
    new: null
    introduced_in: "3.9"
    deprecated_in: null
    removed_in: null
    status: planned
    phase: 2
    code_refs: [diff_diff/estimators.py, diff_diff/twfe.py]
    notes: "Spec section 7 selector contract + roster guard. inference='wild_bootstrap' selects wild CLUSTER bootstrap offered as an ALTERNATIVE to analytical SEs; the SUPPORTING roster is DifferenceInDifferences + TwoWayFixedEffects. NOT a uniformity mandate over every bootstrap - each estimator whose bootstrap IS its inference method runs a materially different procedure and keeps n_bootstrap as documented domain vocabulary (section 6 precedent): CallawaySantAnna = influence-function multiplier bootstrap; SunAbraham = unit-pairs bootstrap (Rao-Wu rescaled under stratified/PSU survey designs); ChaisemartinDHaultfoeuille = group-level influence-function multiplier bootstrap, upgrading to PSU-level Hall-Mammen wild clustering under survey designs with strictly-coarser PSUs. Spelling any of those 'wild_bootstrap' would make a uniform name carry altered meaning (section 8 rule 8). MultiPeriodDiD EXPOSES the param but has no wild-bootstrap path (warns, falls back to analytical); it is removed at 4.0 [M-010] and section 4.1 replaces the fallback with a raise - so the roster pins SUPPORT, not param presence. SCOPE: the selector does not fail closed today - inference= is stored unvalidated (no valid-value check anywhere), and DiD silently routes wild_bootstrap WITHOUT cluster= to analytical (estimators.py, pinned by tests/test_wild_bootstrap.py::test_did_wild_bootstrap_requires_cluster), so a typo or a missing prerequisite silently changes the SE/p/CI procedure - a no-silent-failures violation. Phase 2 makes it fail closed, and 'fail closed' means REFUSE, not warn-and-degrade: (a) the accepted value set is exactly {'analytical', 'wild_bootstrap'}, validated on __init__ AND transactional set_params (an unrecognized spelling raises, never falls through to analytical); (b) wild_bootstrap WITHOUT cluster= raises ValueError - REGISTRY defines WCR as 'inference=\"wild_bootstrap\" (with cluster=)', so the combination is incoherent rather than merely unsupported, and a warned analytical fallback would still run a procedure the caller did not ask for. Flipping the pinned test is expected and its CHANGELOG entry must say so. done requires a test_ref covering: the exact accepted value set and an invalid spelling, transactional set_params, DiD with and without cluster, TWFE, MultiPeriodDiD's fallback, and the roster itself (a future estimator gaining WCR must adopt the selector or land its own row). Companion to [M-081] (n_bootstrap semantics). introduced_in gates the 3.9 cut for the same reason as [M-081]; behavior-at-done requires test_ref."
