    code_refs: [diff_diff/changes_in_changes.py, diff_diff/changes_in_changes_results.py, diff_diff/practitioner.py, diff_diff/__init__.py]
    notes: "method='cic' (default) | 'qdid'; default encodes Athey-Imbens' recommendation of CiC over QDiD. Already one dispatcher/results class internally. SHIPPED 3.9 (Phase 3(c)). method= is KEYWORD-ONLY (every pre-existing positional slot is preserved byte-for-byte; BaseEstimator._param_names accepts KEYWORD_ONLY so get_params/set_params pick it up with no new hooks) and lowercase-only - 'CiC'/'QDiD' casing raises, matching the underscored-only control_group ruling in [M-013]. The METHOD is not deprecated, only the CLASS spelling: method='qdid' emits no advisory warning, because the fit-time footnote-21 non-monotonicity UserWarning and practitioner.py's 'Prefer ChangesInChanges over QDiD' step already carry Athey-Imbens' caution, and a third warning would blur which of class/method is dying. VALIDATION is in BOTH places by necessity: __init__ passes a hand-built dict (it does not forward get_params()), so 'method' is added there AND read as params.get('method', 'cic') inside _validate_all_params - the .get default exists because QDiD keeps its frozen five-param __init__, so its get_params() carries no 'method' key and _fit_distributional re-validates through the same function on every QDiD fit. _fit_distributional's estimator_name now derives from type(est).__name__ instead of the kind literal, so a ChangesInChanges(method='qdid') fit no longer raises errors naming a class the user never constructed (byte-identical on both 3.x surfaces). QDiD stays a STANDALONE sibling, not a subclass: inheriting the merged __init__ would put method into its get_params() and make QDiD(method='cic') constructible. Results-field mirror: [M-143]."
