    - diff_diff/efficient_did_aggregation.py
    - diff_diff/efficient_did_bootstrap.py
    - diff_diff/efficient_did_covariates.py
    - diff_diff/efficient_did_results.py
    - diff_diff/efficient_did_weights.py
  chaisemartin_dhaultfoeuille:
    - diff_diff/chaisemartin_dhaultfoeuille.py
    - diff_diff/chaisemartin_dhaultfoeuille_bootstrap.py
    - diff_diff/chaisemartin_dhaultfoeuille_results.py
